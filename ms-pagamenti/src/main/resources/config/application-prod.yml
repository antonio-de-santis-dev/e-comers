# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    main.ms.pagamenti: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://admin:${jhipster.registry.password}@jhipster-registry:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 100
      uri: http://admin:${jhipster.registry.password}@jhipster-registry:8761/config
      name: msPagamenti
      profile: prod
      label: main
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        kafkaProducer-out-0:
          destination: pagamento-approvato
          content-type: application/json
          group: ms-pagamenti
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: ms-pagamenti
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://mspagamenti-postgresql:5432/msPagamenti
    username: msPagamenti
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: prod
  thymeleaf:
    cache: true
  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8083
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      timeToLiveInDays: 1461
  cache:
    ehcache:
      time-to-live-seconds: 3600
      max-entries: 1000
  registry:
    password: admin
  security:
    authentication:
      jwt:
        base64-secret: OTdkZTlhMDZlNjM2OGZlOTk2ZGZjOWY5MWU3ZGIxNWVlYjEyYTIzYzRiMGY4YzIxOTc5MTU2OGY1YWNhMzM4N2Q5NzRhZmY1OWI2YWY1NDVkZGE4NzY1ZDE4NTg0YjhhYTIxN2ZiOWE3ODI2MjliMDMzNjNkNWE0YzQxMTI5NGI=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
