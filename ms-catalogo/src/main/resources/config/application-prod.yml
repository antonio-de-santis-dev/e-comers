# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    main.ms.catalogo: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      # FIX: localhost → jhipster-registry (nome container Docker)
      defaultZone: http://admin:${jhipster.registry.password}@jhipster-registry:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 100
      # FIX: localhost → jhipster-registry (nome container Docker)
      uri: http://admin:${jhipster.registry.password}@jhipster-registry:8761/config
      name: msCatalogo
      profile: prod
      label: main
  kafka:
    bootstrap-servers: kafka:9092  # FIX: localhost → kafka (nome container Docker)
    consumer:
      group-id: ms-catalogo-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # FIX: localhost → mscatalogo-postgresql (nome container Docker)
    url: jdbc:postgresql://mscatalogo-postgresql:5432/msCatalogo
    username: msCatalogo
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: prod
  thymeleaf:
    cache: true

server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      timeToLiveInDays: 1461
  cache:
    ehcache:
      time-to-live-seconds: 3600
      max-entries: 1000
  registry:
    password: admin
  security:
    authentication:
      jwt:
        base64-secret: MTc4NjYxN2UzZTRiOGI5ZDI3YTRkZmEwNTg4Mzk2NmZkYTAwNWRjZDcyMTVhM2M4OTI5MDg1YWFiNTg0OWE4ZjdiOWU1Mzc1OWU1MzY5ZDJlNjg0ZmJhMDVlNTMyZjY5OWJlM2JkOGIxOTc3YjIxZDI0NzY1MmU0MGZmZjRlYjU=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
