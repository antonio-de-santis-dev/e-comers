logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    main.ms.notifiche: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://admin:${jhipster.registry.password}@jhipster-registry:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 100
      uri: http://admin:${jhipster.registry.password}@jhipster-registry:8761/config
      name: msNotifiche
      profile: prod
      label: main
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        ordineConfermato-in-0:
          destination: ordine-confermato
          group: msnotifiche-ordine
        pagamentoApprovato-in-0:
          destination: pagamento-approvato
          group: msnotifiche-pagamento
        recensioneApprovata-in-0:
          destination: recensione-approvata
          group: msnotifiche-recensione
  data:
    mongodb:
      uri: mongodb://msnotifiche-mongodb:27017/msNotifiche
  thymeleaf:
    cache: true

server:
  port: 8084
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      timeToLiveInDays: 1461
  registry:
    password: admin
  security:
    authentication:
      jwt:
        base64-secret: MWQ5MTVmOThlYzE4ZjgzN2YyYzkxMWUxYWIxYTI0Mzk4MTZjM2Q3YTcwMzNjNTViZjZhNDYxMzliODI0OTJkZWM1Yjk5MDhmY2YxZmI3YjE1YmI4NTNhNTgwMDdiMjhkNTU4N2FjMTVmMDMwM2M2MDMzNTRiY2RhZmY1ZjhkNDc=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
