logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    main.ms.admin: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://admin:${jhipster.registry.password}@jhipster-registry:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 100
      uri: http://admin:${jhipster.registry.password}@jhipster-registry:8761/config
      name: msAdmin
      profile: prod
      label: main
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        ordineConfermato-in-0:
          destination: ordine-confermato
          group: msadmin-ordine
        pagamentoApprovato-in-0:
          destination: pagamento-approvato
          group: msadmin-pagamento
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://msadmin-postgresql:5432/msAdmin
    username: msAdmin
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: prod
  thymeleaf:
    cache: true

server:
  port: 8085
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      timeToLiveInDays: 1461
  cache:
    ehcache:
      time-to-live-seconds: 3600
      max-entries: 1000
  registry:
    password: admin
  security:
    authentication:
      jwt:
        base64-secret: ODY2OWY2NGRjYjgwMzExYTdiNTgwMmQ5NmM3ZjI4OTBjNDdmMDJmZTY4NTU5ZGVlODljYWZlZGZmN2IxZjg0M2RjZjE4Y2NjOTAzMWY1MTNhZTdiODEzMmJjYzMxNjlmOTE5NTk3MDcyMDg4NDY3Y2UxMjczZDA2YmM4YWNjOWI=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
