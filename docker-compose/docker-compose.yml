      - SPRING_DATASOURCE_URL=jdbc:postgresql://msadmin-postgresql:5432/msAdmin
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://msadmin-postgresql:5432/msAdmin
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - JHIPSTER_REGISTRY_PASSWORD=admin
    healthcheck:
      test:
