# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    main.ms.ordini: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://admin:${jhipster.registry.password}@jhipster-registry:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 100
      uri: http://admin:${jhipster.registry.password}@jhipster-registry:8761/config
      name: msOrdini
      profile: prod
      label: main
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        kafkaProducer-out-0:
          destination: ordine-confermato
          content-type: application/json
          group: ms-ordini
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: ms-ordini
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://msordini-postgresql:5432/msOrdini
    username: msOrdini
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: prod
  thymeleaf:
    cache: true
  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8082
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      timeToLiveInDays: 1461
  cache:
    ehcache:
      time-to-live-seconds: 3600
      max-entries: 1000
  registry:
    password: admin
  security:
    authentication:
      jwt:
        base64-secret: NmZhNjA4NGFkZDhmNjc3ODc1MWRkMzA2MmE1NTgwZjE5ZjM3MjU0YjE3MTA5OTllZTViNTBiMDdjMTZiYWE3MDkzMWQwMDRkYjQ3ZTcyZjgxZjgzYmU0NjBhMmU1YTRiOWVjM2ZlZGZkNzhjMzQ0N2FiYTkwNTk2ZWFkYjFhYTk=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
