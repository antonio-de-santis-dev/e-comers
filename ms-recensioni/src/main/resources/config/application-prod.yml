# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    main.ms.recensioni: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://admin:${jhipster.registry.password}@jhipster-registry:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 100
      uri: http://admin:${jhipster.registry.password}@jhipster-registry:8761/config
      name: msRecensioni
      profile: prod
      label: main
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        kafkaProducer-out-0:
          destination: recensione-approvata
          content-type: application/json
          group: ms-recensioni
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: ms-recensioni
  data:
    mongodb:
      uri: mongodb://msrecensioni-mongodb:27017/msRecensioni
  thymeleaf:
    cache: true
  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8086
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      timeToLiveInDays: 1461
  registry:
    password: admin
  security:
    authentication:
      jwt:
        base64-secret: OTM2YjYwNTNhNzhmNDc4Yzg1MTM4YzhiYmE2OGM3MWZiMmI4Y2UyYWVhZmE4YTA0MjE0ZWEzZDM0OTE1MWQxNWE0Yjc0YjQwYzZkZDYyMDBmYmI1ZmVkYTQ1ZjBkMmMxZmM1ODZiZWFlODk0MDU2NTlmN2ZlMTdmNTUzOTVhMjI=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
